<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ユーザー登録 | Go Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-5 col-lg-4">
        <section class="card shadow-sm">
          <div class="card-body p-4">
            <h1 class="h3 mb-4">ユーザー登録</h1>
            <form method="post" action="/register">
              <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
              <div class="mb-3"><label for="username" class="form-label">ユーザー名</label><input id="username" name="username" class="form-control" minlength="3" maxlength="100" autocomplete="username" required></div>
              <div class="mb-4"><label for="password" class="form-label">パスワード</label><input id="password" name="password" type="password" class="form-control" minlength="8" maxlength="72" autocomplete="new-password" required></div>
              <button class="btn btn-primary w-100" type="submit">登録</button>
            </form>
            <a class="btn btn-link w-100 mt-2" href="/login">ログインへ戻る</a>
          </div>
        </section>
      </div>
    </div>
  </main>
</body>
</html>

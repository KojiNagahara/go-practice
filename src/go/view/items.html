<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品管理 | Go Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="display-6 fw-semibold">商品管理</h1><p class="text-body-secondary mb-0">商品情報と画像を管理します。</p></div>
      <a class="btn btn-outline-primary" href="/item-images">画像管理</a>
    </div>
    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">商品を追加</h2>
        <form method="post" action="/items" enctype="multipart/form-data" class="row g-3">
          <div class="col-md-4"><label for="name" class="form-label">商品名</label><input id="name" name="name" class="form-control" maxlength="100" required></div>
          <div class="col-md-5"><label for="description" class="form-label">説明</label><input id="description" name="description" class="form-control" required></div>
          <div class="col-md-2"><label for="price" class="form-label">価格</label><input id="price" name="price" type="number" min="0" step="0.01" class="form-control" required></div>
          <div class="col-12"><label class="form-label">カテゴリ</label><div class="d-flex flex-wrap gap-3">{{range .Categories}}<label class="form-check"><input class="form-check-input" type="checkbox" name="category_id" value="{{.ID}}"><span class="form-check-label">{{.Name}}</span></label>{{else}}<span class="text-body-secondary">カテゴリがありません。</span>{{end}}</div></div>
          <div class="col-12"><label for="image" class="form-label">画像ファイル（任意・複数可）</label><input id="image" name="image" type="file" accept="image/*" multiple class="form-control"><div class="form-text">開発環境ではDocker内、実行環境ではS3へ保存します。</div></div>
          <div class="col-12 d-grid d-md-flex justify-content-md-end"><button class="btn btn-primary" type="submit">商品と画像を登録</button></div>
        </form>
      </div>
    </section>
    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">商品一覧</h2>
        <div class="table-responsive">
          <table class="table align-middle">
            <thead><tr><th>ID</th><th>商品名</th><th>説明</th><th>価格</th><th>画像</th><th></th></tr></thead>
            <tbody>
              {{range .Items}}
              <tr>
                <td>{{.ID}}</td><td>{{.Name}}</td><td>{{.Description}}</td><td>{{.Price}}</td>
                <td><span class="badge text-bg-secondary">{{len .Images}}件</span></td>
                <td class="text-nowrap"><a class="btn btn-outline-secondary btn-sm" href="/items/{{.ID}}/edit">編集</a> <button class="btn btn-outline-danger btn-sm" onclick="deleteItem({{.ID}})">削除</button></td>
              </tr>
              {{else}}<tr><td colspan="6" class="text-body-secondary">商品がありません。</td></tr>{{end}}
            </tbody>
          </table>
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <form method="get" class="d-flex align-items-center gap-2"><input type="hidden" name="page" value="1"><label for="item-per-page">表示件数</label><select id="item-per-page" name="per_page" class="form-select form-select-sm" onchange="this.form.submit()"><option value="10" {{if eq .PerPage 10}}selected{{end}}>10</option><option value="20" {{if eq .PerPage 20}}selected{{end}}>20</option><option value="50" {{if eq .PerPage 50}}selected{{end}}>50</option><option value="100" {{if eq .PerPage 100}}selected{{end}}>100</option></select></form>
          <nav><ul class="pagination pagination-sm mb-0"><li class="page-item {{if not .HasPrev}}disabled{{end}}"><a class="page-link" href="?page={{.PrevPage}}&per_page={{.PerPage}}">前へ</a></li><li class="page-item disabled"><span class="page-link">{{.Page}} / {{.TotalPages}}</span></li><li class="page-item {{if not .HasNext}}disabled{{end}}"><a class="page-link" href="?page={{.NextPage}}&per_page={{.PerPage}}">次へ</a></li></ul></nav>
        </div>
      </div>
    </section>
  </main>
  <script>
    async function deleteItem(id) {
      if (!confirm("この商品を削除しますか？")) return;
      const response = await fetch("/api/items/" + id, {method:"DELETE"});
      if (!response.ok) { alert("削除に失敗しました"); return; } location.reload();
    }
  </script>
</body>
</html>

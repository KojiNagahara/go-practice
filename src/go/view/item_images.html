<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>商品画像管理 | Go Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/items.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="d-flex justify-content-between align-items-center mb-4">
      <div><h1 class="display-6 fw-semibold">商品画像管理</h1><p class="text-body-secondary mb-0">商品画像をアップロードして管理します。</p></div>
      <a class="btn btn-outline-primary" href="/items">商品管理</a>
    </div>
    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5">画像を追加</h2>
        <form method="post" action="/item-images" enctype="multipart/form-data" class="row g-3 align-items-end">
          <div class="col-md-2"><label for="item_id" class="form-label">商品ID</label><input id="item_id" name="item_id" type="number" min="1" class="form-control" required></div>
          <div class="col-md-8"><label for="image" class="form-label">画像ファイル</label><input id="image" name="image" type="file" accept="image/*" multiple class="form-control" required></div>
          <div class="col-md-2 d-grid"><button class="btn btn-primary" type="submit">追加</button></div>
        </form>
      </div>
    </section>
    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5">画像一覧</h2>
        <div class="table-responsive"><table class="table align-middle"><thead><tr><th>ID</th><th>商品ID</th><th>画像</th><th>保存先</th><th></th></tr></thead><tbody>
        {{range .Items}}<tr><td>{{.ID}}</td><td>{{.ItemID}}</td><td><img class="item-thumbnail" src="{{.URL}}" alt="商品画像"></td><td class="text-break">{{.URL}}</td><td class="text-nowrap"><button class="btn btn-outline-danger btn-sm" onclick="deleteImage({{.ID}})">削除</button></td></tr>
          {{else}}<tr><td colspan="5" class="text-body-secondary">画像がありません。</td></tr>{{end}}
        </tbody></table></div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <form method="get" class="d-flex align-items-center gap-2"><input type="hidden" name="page" value="1"><label for="image-per-page">表示件数</label><select id="image-per-page" name="per_page" class="form-select form-select-sm" onchange="this.form.submit()"><option value="10" {{if eq .PerPage 10}}selected{{end}}>10</option><option value="20" {{if eq .PerPage 20}}selected{{end}}>20</option><option value="50" {{if eq .PerPage 50}}selected{{end}}>50</option><option value="100" {{if eq .PerPage 100}}selected{{end}}>100</option></select></form>
          <nav><ul class="pagination pagination-sm mb-0"><li class="page-item {{if not .HasPrev}}disabled{{end}}"><a class="page-link" href="?page={{.PrevPage}}&per_page={{.PerPage}}">前へ</a></li><li class="page-item disabled"><span class="page-link">{{.Page}} / {{.TotalPages}}</span></li><li class="page-item {{if not .HasNext}}disabled{{end}}"><a class="page-link" href="?page={{.NextPage}}&per_page={{.PerPage}}">次へ</a></li></ul></nav>
        </div>
      </div>
    </section>
  </main>
  <script>
    async function deleteImage(id) {
      if (!confirm("この画像を削除しますか？")) return;
      const response = await fetch("/api/item-images/" + id, {method:"DELETE"});
      if (!response.ok) { alert("削除に失敗しました"); return; } location.reload();
    }
  </script>
</body>
</html>

<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>カテゴリ管理 | Go Practice</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/static/categories.css">
</head>
<body class="bg-light">
  <main class="container py-5">
    <div class="mb-4">
      <h1 class="display-6 fw-semibold">カテゴリ管理</h1>
      <p class="text-body-secondary mb-0">商品カテゴリの追加、編集、削除を管理します。</p>
    </div>

    <section class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 card-title">カテゴリを追加</h2>
        <form method="post" action="/categories" class="row g-3 align-items-end">
          <div class="col-md-9">
            <label for="name" class="form-label">カテゴリ名</label>
            <input id="name" name="name" maxlength="100" required class="form-control">
          </div>
          <div class="col-md-3 d-grid">
            <button type="submit" class="btn btn-primary">追加</button>
          </div>
        </form>
      </div>
    </section>

    <section class="card shadow-sm">
      <div class="card-body">
        <h2 class="h5 card-title">カテゴリ一覧</h2>
        <div class="list-group list-group-flush">
    {{range .Items}}
          <div class="list-group-item d-flex align-items-center gap-3 px-0">
            <span class="flex-grow-1">{{.ID}}: {{.Name}}</span>
            <button type="button" class="btn btn-outline-secondary btn-sm" onclick="editCategory({{.ID}}, {{printf "%q" .Name}})">編集</button>
            <button type="button" class="btn btn-outline-danger btn-sm" onclick="deleteCategory({{.ID}})">削除</button>
          </div>
    {{else}}
          <p class="text-body-secondary mb-0">カテゴリがありません。</p>
    {{end}}
        </div>
        <div class="d-flex justify-content-between align-items-center mt-3">
          <form method="get" class="d-flex align-items-center gap-2"><input type="hidden" name="page" value="1"><label for="category-per-page">表示件数</label><select id="category-per-page" name="per_page" class="form-select form-select-sm" onchange="this.form.submit()"><option value="10" {{if eq .PerPage 10}}selected{{end}}>10</option><option value="20" {{if eq .PerPage 20}}selected{{end}}>20</option><option value="50" {{if eq .PerPage 50}}selected{{end}}>50</option><option value="100" {{if eq .PerPage 100}}selected{{end}}>100</option></select></form>
          <nav><ul class="pagination pagination-sm mb-0"><li class="page-item {{if not .HasPrev}}disabled{{end}}"><a class="page-link" href="?page={{.PrevPage}}&per_page={{.PerPage}}">前へ</a></li><li class="page-item disabled"><span class="page-link">{{.Page}} / {{.TotalPages}}</span></li><li class="page-item {{if not .HasNext}}disabled{{end}}"><a class="page-link" href="?page={{.NextPage}}&per_page={{.PerPage}}">次へ</a></li></ul></nav>
        </div>
      </div>
    </section>
  </main>
  <script>
    async function editCategory(id, currentName) {
      const name = prompt("カテゴリ名", currentName);
      if (name === null || name.trim() === "") return;
      const response = await fetch("/api/categories/" + id, {
        method: "PUT",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({name: name.trim()})
      });
      if (!response.ok) { alert("更新に失敗しました"); return; }
      location.reload();
    }
    async function deleteCategory(id) {
      if (!confirm("このカテゴリを削除しますか？")) return;
      const response = await fetch("/api/categories/" + id, {method: "DELETE"});
      if (!response.ok) { alert("削除に失敗しました"); return; }
      location.reload();
    }
  </script>
</body>
</html>
